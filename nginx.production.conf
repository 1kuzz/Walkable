server {
    listen 80;
    listen [::]:80;
    server_name 1kuzz.org www.1kuzz.org;

    root /var/www/walkable/app/dist;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── App-bundled backends (auto-generated) ────────────────────────────────
    include /etc/nginx/portal-apps.conf;

    # Share (VIP) endpoint: no restrictive CSP — serves user app content directly
    location ~ ^/api/share/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Render endpoint: no restrictive CSP — user apps need full resource access inside iframe sandbox
    location ~ ^/api/content/[^/]+/render {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 100m;
    }

    location /api/ {
        include /etc/nginx/snippets/security_headers.conf;
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 100m;
    }

    # Uploaded apps: no CSP — iframe sandbox provides containment; CSP blocks CDN scripts
    location /uploads/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:3001/health;
    }

    location = /version {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        try_files /version.txt =404;
    }
}
