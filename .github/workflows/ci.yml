name: CI

on:
  push:
    branches: [main, "copilot/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/walkable
      NEXTAUTH_SECRET: ci-secret-32chars-xxxxxxxxxxxxxxxx
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_YANDEX_MAPS_API_KEY: test-yandex-map-key
      YANDEX_WEATHER_API_KEY: test-yandex-weather-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - name: Start production server and smoke check
        run: |
          npm run start &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          sleep 10
          curl -fSs http://127.0.0.1:3000/api/health > /dev/null
          curl -fSs "http://127.0.0.1:3000/api/ready?checkExternal=1" > /dev/null
