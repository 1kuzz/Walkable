limit_req_zone $binary_remote_addr zone=health_limit:10m rate=5r/s;

# Redirect nginx temp dirs to /tmp — writable by any user including rootless nginx.
client_body_temp_path  /tmp/nginx_client_temp;
proxy_temp_path        /tmp/nginx_proxy_temp;
fastcgi_temp_path      /tmp/nginx_fastcgi_temp;
uwsgi_temp_path        /tmp/nginx_uwsgi_temp;
scgi_temp_path         /tmp/nginx_scgi_temp;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; require-trusted-types-for 'script';" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy all /api/* and /uploads/* requests to the backend service.
    # resolver 127.0.0.11 defers hostname resolution to request time (Docker DNS)
    # so nginx starts successfully even before the backend container is up.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://${NGINX_BACKEND_HOST}:3001;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Allow large uploads (HTML files can be several MB)
        client_max_body_size 100m;
        # Any add_header here voids parent server-block add_header inheritance (nginx behaviour).
        # This prevents the global strict CSP from being applied to /api/ responses —
        # the backend sets its own per-endpoint CSP (e.g. unsafe-inline for inline HTML apps).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Uploaded multi-file apps (static, shipped in the Docker image).
    location ^~ /uploaded-apps/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location ^~ /uploads/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://${NGINX_BACKEND_HOST}:3001;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # HTML files must never be heuristically cached — JS chunks use content hashes.
        add_header Cache-Control "no-cache" always;
    }

    location = /version {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        try_files /version.txt =404;
    }

    location = /health {
        limit_req zone=health_limit burst=10 nodelay;
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }
}
