<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background -->
  <rect width="256" height="256" fill="#1a2536" rx="24"/>
  <!-- Envelope body -->
  <rect x="36" y="76" width="184" height="128" fill="none" stroke="#29CCB1" stroke-width="10" rx="10"/>
  <!-- Envelope fold/flap line -->
  <polyline points="36,76 128,152 220,76" fill="none" stroke="#29CCB1" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Bottom content lines -->
  <line x1="68" y1="178" x2="188" y2="178" stroke="#29CCB1" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
  <line x1="68" y1="160" x2="158" y2="160" stroke="#29CCB1" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
  <!-- Small pencil/edit dot in corner — signals "editor" -->
  <circle cx="196" cy="192" r="14" fill="#29CCB1"/>
  <line x1="190" y1="198" x2="202" y2="186" stroke="#1a2536" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="188" y1="200" x2="193" y2="197" stroke="#1a2536" stroke-width="3" stroke-linecap="round"/>
</svg>
